<style>
/* Layout: satu kolom tengah (maks 880px). Beranda -> soal satu per satu -> hasil. Warna jawaban ala kuis kelas, nuansa biru tinta. */
:root{
  --bg:#eef2fb; --surface:#ffffff; --fg:#141c3a; --muted:#5b6585; --line:#d5dcef;
  --accent:#2b4fd8; --accent-fg:#ffffff; --good:#17824a; --good-bg:#dff5e8; --bad:#c62f3a; --bad-bg:#fde4e6;
  --a1:#e5484d; --a2:#2f6fed; --a3:#f5b700; --a4:#2a9d5c; --a5:#8e4ec6; --a3t:#2a2100;
  --font-d:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif; --font-b:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1226; --surface:#171e3a; --fg:#eef1ff; --muted:#9aa4c8; --line:#2b3560;
  --accent:#7d9bff; --accent-fg:#0d1226; --good:#5fd596; --good-bg:#12362a; --bad:#ff8088; --bad-bg:#3b1a22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1226; --surface:#171e3a; --fg:#eef1ff; --muted:#9aa4c8; --line:#2b3560;
  --accent:#7d9bff; --accent-fg:#0d1226; --good:#5fd596; --good-bg:#12362a; --bad:#ff8088; --bad-bg:#3b1a22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:16px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:14px 22px;font-weight:700;font-size:1.05rem}
.btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* home */
.hero{padding:8px 0 4px}
.hero h1{font-size:clamp(2.2rem,8vw,3.8rem);font-weight:800;letter-spacing:-.02em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);margin:10px 0 0;max-width:52ch}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lbl{font-weight:700}
input[type=text]{font:inherit;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.chip small{opacity:.75;margin-left:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hint{color:var(--muted);font-size:.9rem}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lb li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.lb li:last-child{border:0}
.lb .rk{font-family:var(--font-d);font-weight:800;color:var(--accent)}
.lb .sc{font-variant-numeric:tabular-nums;font-weight:700}

/* game */
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hud .pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.hud .grow{flex:1;min-width:120px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.timer{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.timer>i{display:block;height:100%;width:100%;background:var(--good)}
.timer.low>i{background:var(--bad)}
.pass{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.pass .eyebrow{margin-bottom:6px}
.pass .body{white-space:pre-line;max-width:68ch}
.pass .body.quote{font-family:var(--font-d);font-size:1.4rem;font-weight:600}
.pass svg{display:block;max-width:100%;height:auto;border-radius:8px;margin-top:10px}
.q{font-family:var(--font-d);font-size:clamp(1.25rem,4.2vw,1.65rem);font-weight:600;line-height:1.25;max-width:60ch}
.qmeta{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.tag{background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:2px 9px;font-size:.78rem;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:12px;padding:14px;min-height:72px;color:#fff;font-weight:500;line-height:1.3;
  box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s,opacity .2s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.opt .k{flex:none;width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:1.05rem}
.opt[data-i="0"]{background:var(--a1)} .opt[data-i="1"]{background:var(--a2)} .opt[data-i="3"]{background:var(--a4)} .opt[data-i="4"]{background:var(--a5)}
.opt[data-i="2"]{background:var(--a3);color:var(--a3t)} .opt[data-i="2"] .k{background:rgba(0,0,0,.14)}
.opt.sel{outline:4px solid var(--fg);outline-offset:2px}
.opt.dim{opacity:.35}
.opt.right{outline:4px solid var(--good);outline-offset:2px;opacity:1}
.opt.wrong{outline:4px solid var(--bad);outline-offset:2px;opacity:1}
.opt .mark{margin-left:auto;font-weight:800;font-size:1.2rem}
.opt:disabled{cursor:default}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
.fb{border-radius:12px;padding:14px 16px;margin-top:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fb.ok{background:var(--good-bg);color:var(--good)} .fb.no{background:var(--bad-bg);color:var(--bad)}
.fb h3{font-size:1.3rem} .fb p{margin:2px 0 0;color:var(--fg)}
.fb .pts{margin-left:auto;font-family:var(--font-d);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}

/* result */
.big{font-family:var(--font-d);font-weight:800;font-size:clamp(2.6rem,12vw,4.5rem);line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--bg);border-radius:10px;padding:12px}
.stat b{display:block;font-family:var(--font-d);font-size:1.5rem;font-variant-numeric:tabular-nums}
.rev{display:flex;flex-direction:column;gap:12px}
.rev .it{border-left:4px solid var(--bad);padding:4px 0 4px 12px}
.rev .it p{margin:2px 0}
.votes{margin-top:16px}
.votes:empty{display:none}
.vhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.vrow{display:grid;grid-template-columns:34px 1fr minmax(104px,auto);gap:10px;align-items:center;padding:4px 0;transition:opacity .3s}
.vrow.dim{opacity:.35}
.vrow .k{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-family:var(--font-d);font-weight:800;color:#fff}
.vrow[data-i="0"] .k,.vrow[data-i="0"] .f{background:var(--a1)} .vrow[data-i="1"] .k,.vrow[data-i="1"] .f{background:var(--a2)}
.vrow[data-i="2"] .k,.vrow[data-i="2"] .f{background:var(--a3)} .vrow[data-i="2"] .k{color:var(--a3t)}
.vrow[data-i="3"] .k,.vrow[data-i="3"] .f{background:var(--a4)} .vrow[data-i="4"] .k,.vrow[data-i="4"] .f{background:var(--a5)}
.vrow .tr{height:26px;background:var(--bg);border-radius:8px;overflow:hidden;display:flex;align-items:center}
.vrow .f{height:100%;border-radius:8px;transition:width .4s}
.vrow .tx{font-size:.8rem;font-weight:700;padding-left:8px;white-space:nowrap}
.vrow .n{font-weight:700;font-size:.95rem;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vrow.right .tr{outline:3px solid var(--good)}
.vrow.right .n::before{content:"✓ ";color:var(--good)}
.lvbox{display:flex;flex-direction:column;gap:16px}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.names span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.88rem}
@media (max-width:560px){.opts,.grid2{grid-template-columns:1fr}.opt{min-height:60px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function orderQs(list){

  return shuffle(groups).flat();
}

function cleanChoice(q,str){
  const set=[...new Set(String(str||"").toUpperCase().split("").filter(ch=>"ABCDE".includes(ch)))].sort();
  return (q.a.length===1?set.slice(0,1):set).join("");
}
function keyOf(q){ return [...q.a].sort().join(""); }
// Statistik dihitung ulang dari dokumen jawaban setiap kali, tidak pernah dari penghitung yang ditambah-tambah.
function liveTally(q,round,answers,players){
  const c=[0,0,0,0,0], who={};
  for(const uid in answers){
    const d=answers[uid]; if(!d||d.r!==round||!d.a) continue;
    const ch=cleanChoice(q,d.a[q.n]); if(!ch) continue;
    who[uid]=ch; for(const l of ch) c["ABCDE".indexOf(l)]++;
  }
  const answered=Object.keys(who).length, part=new Set(Object.keys(who));
  for(const uid in players) if(players[uid]&&players[uid].r===round) part.add(uid);
  const waiting=[...part].filter(u=>!(u in who));
  return {c,answered,participants:part.size,waiting,who};
}
function liveScores(st,answers,players){
  const rows={}, round=st.round, upto=st.upto==null?-1:st.upto;
  const add=uid=>rows[uid]||(rows[uid]={uid,ok:0});
  for(const uid in players) if(players[uid]&&players[uid].r===round) add(uid);
  for(let i=0;i<=upto&&i<st.order.length;i++){
    const q=QN[st.order[i]];
    for(const uid in answers){
      const d=answers[uid]; if(!d||d.r!==round||!d.a) continue;
      add(uid); if(cleanChoice(q,d.a[q.n])===keyOf(q)) rows[uid].ok++;
    }
  }
  return Object.values(rows).map(r=>({uid:r.uid,ok:r.ok,name:(players[r.uid]&&players[r.uid].name)||"Siswa",score:r.ok*1000}))
    .sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
}
function reduceState(st,act,o){
  o=o||{};
  if(act==="new") return {round:o.round,order:o.order,idx:0,status:"lobby",limit:o.limit||0,upto:-1,openedAt:0};
  if(!st) return st;
  if(act==="open" && (st.status==="lobby"||st.status==="closed")) return {...st,status:"open",openedAt:o.now};
  if(act==="close" && st.status==="open") return {...st,status:"closed"};
  if(act==="reveal" && st.status==="closed") return {...st,status:"revealed",upto:st.idx};
  if(act==="next" && st.status==="revealed") return st.idx+1<st.order.length ? {...st,idx:st.idx+1,status:"open",openedAt:o.now} : {...st,status:"ended"};
  if(act==="end" && st.status!=="ended") return {...st,status:"ended"};
  return st;
}
// Satu dokumen jawaban per siswa (answers/<id>), satu soal per kunci. Perubahan jawaban menimpa kunci yang sama.
function makeSender(db,uid,getRound,getOwn){
  let chain=Promise.resolve(), pending=0; const api={err:false, busy:()=>pending>0};
  api.send=(n,choice)=>{
    pending++;
    chain=chain.then(async()=>{
      for(let attempt=0;attempt<3;attempt++){
        try{
          const r=getRound(), ref=db.doc("answers/"+uid); let own=getOwn();
          if(!own||own.r!==r){ const s=await ref.get(); own=s.exists?s.data():null; }
          if(own&&own.r===r) await ref.update({a:{[n]:choice},ts:Date.now()});
          else await ref.set({r,a:{[n]:choice},ts:Date.now()});
          api.err=false; return;
        }catch(e){ api.err=true; await new Promise(res=>setTimeout(res,300*(attempt+1))); }
      }
    }).then(()=>{pending--;});
    return chain;
  };
  return api;
}

    return `<div class="vrow ${showKey?(key.has(L[i])?"right":"dim"):""}" data-i="${i}"><span class="k">${L[i]}</span><div class="tr" aria-hidden="true"><div class="f" style="width:${tl.c[i]?Math.max(3,pct):0}%"></div></div><span class="n">${tl.c[i]} siswa (${fmtPct(pct)})</span></div>`;
  }).join("");
  return `<div class="vhead"><b>Statistik jawaban</b><span class="hint">Total menjawab: ${tl.answered} dari ${tl.participants} siswa · Belum menjawab: ${tl.participants-tl.answered}</span></div>${rows}
    <div class="hint" style="margin-top:8px">${tops.length?`Paling banyak dipilih: ${tops.join(", ")} (${top} siswa)`:"Belum ada jawaban masuk."}${q.a.length>1?" · Soal ini boleh memilih lebih dari satu, jadi persentase bisa lebih dari 100% jika dijumlahkan.":""}</div>`;
}
function lbHTML(rows,meUid,limit){
  if(!rows.length) return `<p class="hint">Belum ada peserta.</p>`;
  return `<ol class="lb">${rows.slice(0,limit).map((r,i)=>`<li><span class="rk">${i+1}</span><span>${esc(r.name)}${r.uid===meUid?" (kamu)":""} <span class="hint">· ${r.ok} benar</span></span><span class="sc">${r.score}</span></li>`).join("")}</ol>`;
}
const namesHTML=(uids)=>`<div class="names">${uids.map(u=>`<span>${esc((LV.players[u]&&LV.players[u].name)||"Siswa")}</span>`).join("")}</div>`;
const curQ=()=>{ const st=LV.state; return st&&st.order&&st.order[st.idx]!=null&&st.status!=="lobby"&&st.status!=="ended"?QN[st.order[st.idx]]:null; };
function roundPlayers(){ const r=LV.state&&LV.state.round; return Object.keys(LV.players).filter(u=>LV.players[u].r===(r||"")||LV.players[u].r===r); }

function live(){
  SCREEN="live"; clearInterval(tick); G=null; clearInterval(LV.tt); LV.view=null; LV.key="";
  const w=liveWhy(), canJoin=LV.db&&LV.can!==false, nm=LV.name||lsGet(NK)||"";
  app.innerHTML=`<div class="hero"><div class="eyebrow">Kelas live</div><h1>Gabung <span>kelas</span></h1><p>Guru mengatur soal di dashboard. Siswa menjawab dari perangkat masing-masing dan statistik jawaban muncul langsung.</p></div>
  <div class="card" style="display:flex;flex-direction:column;gap:16px">
    ${w?`<div class="hint" id="lw">${w}</div>`:`<div class="hint" id="lw">Terhubung. ${Object.keys(LV.players).length} siswa tercatat.</div>`}
    <div class="field"><label for="lname">Nama atau kode peserta</label><input id="lname" type="text" maxlength="24" value="${esc(nm)}" placeholder="Contoh: Aldi 11A" autocomplete="off"><div class="hint" id="lerr"></div></div>
    <div class="actions" style="margin:0"><button class="btn" id="lj" ${canJoin?"":"disabled"}>Gabung sebagai siswa</button>${LV.admin?`<button class="btn ghost" id="lt">Buka dashboard guru</button>`:""}<button class="btn ghost" id="lh">Kembali ke beranda</button></div>
  </div>`;
  $("#lh").onclick=home;
  $("#lj").onclick=()=>{
    const name=$("#lname").value.trim().replace(/\s+/g," ");
    if(name.length<2){ $("#lerr").textContent="Tulis nama atau kode minimal 2 huruf."; return; }
    const r=(LV.state&&LV.state.round)||"";
    const dup=Object.keys(LV.players).some(u=>u!==LV.uid&&LV.players[u].r===r&&String(LV.players[u].name).toLowerCase()===name.toLowerCase());
    if(dup){ $("#lerr").textContent="Nama itu sudah dipakai peserta lain. Tambahkan kelas atau inisial."; return; }
    LV.name=name; lsSet(NK,name); enterLive("siswa");
  };
  if(LV.admin) $("#lt").onclick=()=>enterLive("guru");
}
function enterLive(view){
  SCREEN="live"; LV.view=view; LV.key=""; lsSet(LK,JSON.stringify({v:view,t:Date.now()}));
  app.innerHTML=`<div class="hud"><button class="btn ghost" id="lback" style="padding:8px 14px">← Keluar</button><span class="hint" id="lwho">${view==="guru"?"Dashboard guru":"Siswa: "+esc(LV.name)}</span></div><div id="lv" class="lvbox"></div>`;
  $("#lback").onclick=()=>{ clearInterval(LV.tt); lsSet(LK,""); live(); };
  liveRefresh();
}
function liveSchedule(){ if(LV.tm) return; LV.tm=setTimeout(()=>{LV.tm=null; liveRefresh();},120); }
function liveRefresh(){
  if(SCREEN!=="live"||!LV.view||!$("#lv")) return;
  if(LV.view==="guru") teacherRefresh(); else studentRefresh();
}

/* ---------- siswa ---------- */
const remoteChoice=(q)=>{ const st=LV.state, own=LV.answers[LV.uid]; return st&&own&&own.r===st.round?cleanChoice(q,own.a&&own.a[q.n]):""; };
const effChoice=(q)=>LV.local[q.n]!==undefined?LV.local[q.n]:remoteChoice(q);
function ensureJoined(){
  const st=LV.state, me=LV.players[LV.uid], r=(st&&st.round)||"";
  if(!LV.name||!LV.loadedP||!LV.db||LV.can===false) return;
  if(me&&me.name===LV.name&&me.r===r) return;
  const tag=r+"|"+LV.name; if(LV.joining===tag) return; LV.joining=tag;
  LV.db.doc("players/"+LV.uid).set({name:LV.name,r,t:Date.now()}).catch(()=>{LV.joining="";});
}
function studentRefresh(){
  const st=LV.state;
  if(st&&LV.localRound!==st.round){ LV.localRound=st.round; LV.local={}; LV.draft={}; }
  ensureJoined();
  const key=st?`${st.round}|${st.idx}|${st.status}`:"none";
  if(key!==LV.key){ LV.key=key; studentShell(); }
  studentDyn();
}
function studentShell(){
  const st=LV.state, box=$("#lv"), q=curQ();
  if(!st||st.status==="lobby"){ box.innerHTML=`<div class="card"><div class="eyebrow">Halo, ${esc(LV.name)}</div><h2 style="font-size:1.7rem;margin:6px 0">Menunggu guru memulai</h2><p class="hint" id="lv-dyn"></p></div>`; return; }
  if(st.status==="ended"){ box.innerHTML=`<div class="card"><div class="eyebrow">Sesi selesai</div><h2 style="font-size:1.7rem;margin:6px 0 12px">Peringkat kelas</h2><div id="lv-dyn"></div></div>`; return; }
  box.innerHTML=`<div class="hud"><span class="pill">Soal ${st.idx+1}/${st.order.length}</span><div class="grow"><div class="prog"><i style="width:${st.idx/st.order.length*100}%"></i></div></div><span class="pill" id="lv-score"></span></div>
  <div class="card">${qHead(q)}${passHTML(q)}<div class="q">${esc(q.q)}</div><div class="opts" style="margin-top:16px">${optsHTML(q)}</div>
    <div class="actions" id="lv-act"></div><div class="hint" id="lv-dyn" aria-live="polite" style="margin-top:10px"></div>
    <div class="votes" id="lv-stats"></div><div id="lv-fb"></div></div>`;
  box.querySelector(".opts").onclick=e=>{ const b=e.target.closest(".opt"); if(b) studentPick(+b.dataset.i); };
  window.scrollTo({top:0});
}
function studentSender(){
  if(!LV.sender) LV.sender=makeSender(LV.db,LV.uid,()=>LV.state&&LV.state.round,()=>LV.answers[LV.uid]);
  return LV.sender;
}
function studentSend(q,choice){ LV.local[q.n]=choice; LV.lastSend={q,choice}; studentSender().send(q.n,choice).then(()=>{ if(SCREEN==="live") studentDyn(); }); studentDyn(); }
function studentPick(i){
  const st=LV.state, q=curQ(); if(!st||!q||st.status!=="open"||!LV.loaded||LV.can===false) return;
  const l=L[i];
  if(q.a.length===1){ studentSend(q,l); return; }
  const d=LV.draft[q.n]||(LV.draft[q.n]=new Set(effChoice(q).split("").filter(Boolean)));
  d.has(l)?d.delete(l):d.add(l); studentDyn();
}
function studentDyn(){
  const st=LV.state, dyn=$("#lv-dyn"); if(!dyn) return;
  if(!st||st.status==="lobby"){ dyn.textContent=`${roundPlayers().length} siswa sudah bergabung.`; return; }
  if(st.status==="ended"){ const rows=liveScores(st,LV.answers,LV.players); const i=rows.findIndex(r=>r.uid===LV.uid);
    dyn.innerHTML=(i>=0?`<p style="margin:0 0 10px"><b>Posisimu: ${i+1} dari ${rows.length}</b> · ${rows[i].ok} jawaban benar</p>`:"")+lbHTML(rows,LV.uid,10); return; }
  const q=curQ(); if(!q) return;
  const multi=q.a.length>1, eff=effChoice(q), rc=remoteChoice(q), confirmed=eff&&rc===eff&&!LV.ansPending;
  const shown=new Set((multi&&st.status==="open"?(LV.draft[q.n]?[...LV.draft[q.n]]:eff.split("")):eff.split("")).filter(Boolean));
  const key=new Set(q.a);
  document.querySelectorAll("#lv .opt").forEach((b,k)=>{
    const l=L[k]; b.disabled=st.status!=="open"; b.classList.remove("sel","dim","right","wrong"); b.querySelector(".mark").textContent="";
    if(st.status==="open"){ if(shown.has(l)) b.classList.add("sel"); }
    else if(st.status==="closed"){ shown.has(l)?b.classList.add("sel"):b.classList.add("dim"); }
    else { if(key.has(l)){ b.classList.add("right"); b.querySelector(".mark").textContent="✓"; } else if(shown.has(l)){ b.classList.add("wrong"); b.querySelector(".mark").textContent="✗"; } else b.classList.add("dim"); }
  });
  const act=$("#lv-act"); act.innerHTML="";
  const sender=LV.sender;
  if(st.status==="open"){
    if(!LV.loaded) dyn.textContent="Menyambungkan...";
    else if(multi){
      const dr=LV.draft[q.n]?[...LV.draft[q.n]].sort().join(""):eff;
      dyn.textContent = confirmed&&dr===eff ? "Jawabanmu terkirim ✓. Kamu masih bisa mengubahnya sampai guru menutup voting." : sender&&sender.err ? "Gagal terkirim. Coba kirim lagi." : eff&&!confirmed&&dr===eff ? "Mengirim..." : "Pilih semua jawaban yang benar, lalu kirim.";
      const b=document.createElement("button"); b.className="btn"; b.textContent=eff?"Perbarui jawaban":"Kirim jawaban"; b.disabled=!dr||(dr===eff&&confirmed);
      b.onclick=()=>studentSend(q,[...LV.draft[q.n]].sort().join("")); act.appendChild(b);
    } else {
      dyn.textContent = !eff ? "Pilih satu jawaban." : confirmed ? "Jawabanmu terkirim ✓. Kamu masih bisa mengganti sampai guru menutup voting." : sender&&sender.err ? "Gagal terkirim. Coba kirim lagi." : "Mengirim...";
      if(sender&&sender.err&&LV.lastSend){ const b=document.createElement("button"); b.className="btn"; b.textContent="Kirim ulang"; b.onclick=()=>studentSend(LV.lastSend.q,LV.lastSend.choice); act.appendChild(b); }
    }
    $("#lv-stats").innerHTML=""; $("#lv-fb").innerHTML="";
  } else {
    const tl=liveTally(q,st.round,LV.answers,LV.players);
    $("#lv-stats").innerHTML=statsHTML(q,tl,st.status==="revealed");
    if(st.status==="closed") dyn.textContent=eff?`Voting ditutup. Jawabanmu: ${eff.split("").join(", ")}. Menunggu guru menampilkan jawaban benar.`:"Voting ditutup. Kamu belum mengirim jawaban.";
    else { const ok=eff===keyOf(q); dyn.textContent="";
      $("#lv-fb").innerHTML=`<div class="fb ${ok?"ok":"no"}" style="margin-top:12px"><div><h3>${ok?"Benar!":eff?"Belum tepat":"Tidak menjawab"}</h3><p>${ok?"Bagus.":`Jawaban yang benar: <b>${q.a.split("").join(", ")}</b>`}</p></div></div>`; }
  }
  const me=liveScores({...st,upto:st.status==="revealed"?st.idx:st.idx-1},LV.answers,LV.players).find(r=>r.uid===LV.uid);
  const sc=$("#lv-score"); if(sc) sc.textContent=`${me?me.ok:0} benar`;
}

/* ---------- guru ---------- */
function tset(st){
  LV.state=st; LV.tchain=(LV.tchain||Promise.resolve()).then(()=>LV.db.doc("session/state").set(st)).catch(()=>{LV.tErr=true;});
  liveRefresh();
}
function tact(act){ const n=reduceState(LV.state,act,{now:Date.now()}); if(n!==LV.state) tset(n); }
function newSession(){
  const order=Q.filter(q=>LV.topics.has(q.t)).map(q=>q.n); if(!order.length) return;
  tset(reduceState(null,"new",{round:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),order,limit:LV.limit}));
}
function teacherRefresh(){
  const st=LV.state, key=st?`${st.round}|${st.idx}|${st.status}`:"none";
  if(key!==LV.key){ LV.key=key; teacherShell(); }
  teacherDyn();
}
function setupHTML(){
  const total=Q.filter(q=>LV.topics.has(q.t)).length;
  return `<div class="card" style="display:flex;flex-direction:column;gap:16px"><h2 style="font-size:1.5rem">Sesi baru</h2>
    <div class="field"><span class="lbl">Topik soal</span><div class="chips" id="ttop">${TOPICS.map(t=>`<button class="chip" data-id="${t.id}" aria-pressed="${LV.topics.has(t.id)}">${t.name}<small>${count(t.id)}</small></button>`).join("")}</div></div>
    <div class="field"><span class="lbl">Batas waktu per soal</span><div class="chips" id="tlim">${[[0,"Manual"],[30,"30 dtk"],[60,"60 dtk"],[90,"90 dtk"]].map(([v,n])=>`<button class="chip" data-v="${v}" aria-pressed="${LV.limit===v}">${n}</button>`).join("")}</div><div class="hint">Dengan batas waktu, voting ditutup otomatis oleh dashboard ini. Biarkan tab guru tetap terbuka.</div></div>
    <div class="actions" style="margin:0"><button class="btn" id="tnew" ${total?"":"disabled"}>Mulai sesi baru · ${total} soal</button></div>
    <div class="hint">Sesi baru mengosongkan statistik. Siswa yang sedang membuka halaman bergabung otomatis.</div></div>`;
}
function bindSetup(){
  const t=$("#ttop"); if(!t) return;
  t.onclick=e=>{ const b=e.target.closest(".chip"); if(!b) return; const id=b.dataset.id; LV.topics.has(id)?LV.topics.delete(id):LV.topics.add(id); LV.key=""; teacherRefresh(); };
  $("#tlim").onclick=e=>{ const b=e.target.closest(".chip"); if(!b) return; LV.limit=+b.dataset.v; LV.key=""; teacherRefresh(); };
  $("#tnew").onclick=newSession;
}
function teacherShell(){
  const st=LV.state, box=$("#lv"); clearInterval(LV.tt);
  if(!st){ box.innerHTML=setupHTML(); bindSetup(); return; }
  if(st.status==="ended"){ box.innerHTML=`<div class="card"><div class="eyebrow">Sesi selesai</div><h2 style="font-size:1.6rem;margin:6px 0 12px">Peringkat kelas</h2><div id="t-lb"></div></div>${setupHTML()}`; bindSetup(); return; }
  if(st.status==="lobby"){ box.innerHTML=`<div class="card"><div class="eyebrow">Ruang tunggu · ${st.order.length} soal</div><h2 style="font-size:1.6rem;margin:6px 0">Siswa yang sudah bergabung</h2><div id="t-players"></div>
    <div class="actions"><button class="btn" id="t-open">Mulai soal 1</button><button class="btn ghost" id="t-end">Batalkan sesi</button></div></div>`;
    $("#t-open").onclick=()=>tact("open"); $("#t-end").onclick=()=>tact("end"); return; }
  const q=curQ(), last=st.idx+1>=st.order.length;
  const ctl = st.status==="open" ? `<button class="btn" id="t-close">Tutup voting</button>`
    : st.status==="closed" ? `<button class="btn" id="t-reveal">Tampilkan jawaban benar ke siswa</button><button class="btn ghost" id="t-reopen">Buka lagi voting</button>`
    : `<button class="btn" id="t-next">${last?"Akhiri & lihat peringkat":"Soal berikutnya"}</button>`;
  box.innerHTML=`<div class="hud"><span class="pill">Soal ${st.idx+1}/${st.order.length}</span><div class="grow"><div class="prog"><i style="width:${st.idx/st.order.length*100}%"></i></div></div><span class="pill" id="t-st"></span></div>
  ${st.status==="open"&&st.limit?`<div class="timer" id="t-timer"><i></i></div>`:""}
  <div class="card">${qHead(q)}${passHTML(q)}<div class="q">${esc(q.q)}</div><div class="opts" style="margin-top:16px">${optsHTML(q)}</div>
    <div class="actions">${ctl}${st.status!=="revealed"?`<button class="btn ghost" id="t-end">Akhiri sesi</button>`:""}</div></div>
  <div class="card" id="t-stats"></div><div class="card" id="t-wait" hidden></div><div class="card" id="t-lbc" hidden><h2 style="font-size:1.3rem;margin-bottom:8px">Peringkat sementara</h2><div id="t-lb"></div></div>`;
  document.querySelectorAll("#lv .opt").forEach(b=>b.disabled=true);
  const on=(id,f)=>{const e=$(id); if(e) e.onclick=f;};
  on("#t-close",()=>tact("close")); on("#t-reveal",()=>tact("reveal")); on("#t-reopen",()=>tact("open")); on("#t-next",()=>tact("next")); on("#t-end",()=>tact("end"));
  window.scrollTo({top:0});
  if(st.status==="open"&&st.limit){
    LV.tt=setInterval(()=>{
      const s=LV.state, el=$("#t-timer"); if(!s||s.status!=="open"||!el){ clearInterval(LV.tt); return; }
      const left=s.limit-(Date.now()-s.openedAt)/1000;
      el.firstElementChild.style.width=Math.max(0,left/s.limit*100)+"%"; el.classList.toggle("low",left<=10);
      const p=$("#t-st"); if(p) p.textContent=Math.ceil(Math.max(0,left))+" dtk";
      if(left<=0){ clearInterval(LV.tt); tact("close"); }
    },250);
  }
}
function teacherDyn(){
  const st=LV.state;
  if(st&&st.status==="lobby"){ const pl=roundPlayers(); $("#t-players").innerHTML=pl.length?namesHTML(pl)+`<p class="hint">${pl.length} siswa bergabung.</p>`:`<p class="hint">Belum ada siswa. Minta siswa membuka halaman ini dan memilih Kelas live.</p>`; return; }
  if(!st) return;
  if(st.status==="ended"){ const e=$("#t-lb"); if(e) e.innerHTML=lbHTML(liveScores(st,LV.answers,LV.players),null,40); return; }
  const q=curQ(); if(!q) return;
  const tl=liveTally(q,st.round,LV.answers,LV.players), showKey=st.status!=="open";
  document.querySelectorAll("#lv .opt").forEach((b,k)=>{ b.classList.remove("right","dim"); b.querySelector(".mark").textContent=""; if(showKey){ if(q.a.includes(L[k])){b.classList.add("right"); b.querySelector(".mark").textContent="✓";} else b.classList.add("dim"); } });
  $("#t-stats").innerHTML=statsHTML(q,tl,showKey);
  const w=$("#t-wait"); w.hidden=!(tl.waiting.length&&st.status!=="revealed");
  if(!w.hidden) w.innerHTML=`<b>Belum menjawab (${tl.waiting.length})</b>${namesHTML(tl.waiting)}`;
  const p=$("#t-st"); if(p&&!(st.status==="open"&&st.limit)) p.textContent=st.status==="open"?"Voting dibuka":st.status==="closed"?"Voting ditutup":"Jawaban ditampilkan";
  const lbc=$("#t-lbc"); lbc.hidden=st.status!=="revealed"; if(!lbc.hidden) $("#t-lb").innerHTML=lbHTML(liveScores(st,LV.answers,LV.players),null,5);
}

/* ---------- koneksi ---------- */
(async()=>{
  try{
    if(!(window.claude&&window.claude.use)) return;
    const user=await window.claude.use("user");
    if(user){ LV.admin=(await user.canEdit())||(await user.isOwner()); LV.uid=await user.id(); LV.can=await user.can("data.write"); }
    const db=await window.claude.use("db");
    if(db&&LV.uid){
      LV.db=db;
      const bad=()=>{LV.subErr=true; liveSchedule();};
      db.doc("session/state").onSnapshot(s=>{ LV.state=s.exists?s.data():null; LV.loaded=true; liveSchedule(); },bad);
      db.collection("players").onSnapshot(s=>{ LV.players={}; s.docs.forEach(d=>{LV.players[d.id]=d.data()||{};}); LV.loadedP=true; liveSchedule(); },bad);
      db.collection("answers").onSnapshot(s=>{ LV.answers={}; s.docs.forEach(d=>{LV.answers[d.id]=d.data()||{};}); LV.ansPending=s.metadata.hasPendingWrites; liveSchedule(); },bad);
    }
  }catch(e){}
  LV.init=true;
  const w=$("#lw"); if(w&&SCREEN==="live"&&!LV.view) live();
  if(SCREEN==="home"){
    try{ const r=JSON.parse(lsGet(LK)||"null"); if(r&&LV.db&&Date.now()-r.t<6*3600e3&&(r.v==="siswa"||LV.admin)){ LV.name=lsGet(NK)||LV.name; if(r.v==="guru"||LV.name){ enterLive(r.v); } } }catch(e){}
  }
})();

home();
</script>

</body></html>
